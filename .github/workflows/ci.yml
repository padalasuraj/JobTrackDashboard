name: Verify JobTrack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8080

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jobtrack_test
          POSTGRES_USER: jobtrack_test
          POSTGRES_PASSWORD: jobtrack_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobtrack_test -d jobtrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/jobtrack_test
      TEST_DATABASE_USERNAME: jobtrack_test
      TEST_DATABASE_PASSWORD: jobtrack_ci_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      DEV_EMAIL_LOG: "false"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the website and Java API
        run: |
          node scripts/start-local.mjs > "$RUNNER_TEMP/jobtrack-local.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jobtrack-local.pid"
      - name: Wait for both services
        run: |
          for attempt in $(seq 1 120); do
            if curl --silent --fail --max-time 2 http://localhost:8080/api/health > /dev/null && curl --silent --fail --max-time 2 http://localhost:3000/login > /dev/null; then
              echo "Website and Java API are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Website or Java API did not become ready."
          exit 1
      - run: npm run test:e2e
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/jobtrack-local.pid" ]; then
            kill -TERM "$(cat "$RUNNER_TEMP/jobtrack-local.pid")" || true
          fi
